[tox]
envlist = py39, py310, py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
# The CI pipeline uses Poetry directly; tox remains a convenience for running
# the unit suite against every supported interpreter from an already-installed
# Poetry environment.
skip_install = true
allowlist_externals = poetry
commands =
    poetry run pytest -q tests
